<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動画・SNS埋め込みテスト | ToyBox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* レスポンシブ動画（16:9を保ったまま可変） */
    .video-wrap { position: relative; width: 100%; padding-top: 56.25%; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.15); }
    .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">
  <div class="max-w-2xl mx-auto px-6 py-16">
    <p class="text-purple-500 text-sm font-medium tracking-widest uppercase mb-2">EMBED TEST</p>
    <h1 class="text-3xl font-black mb-2">動画・SNS埋め込みテスト</h1>
    <p class="text-gray-500 text-sm mb-12">LP内にYouTube・Instagramを埋め込めるかの検証ページ。</p>

    <!-- ① YouTube 埋め込み（iframe・レスポンシブ） -->
    <h2 class="text-xl font-bold mb-4">① YouTube動画（iframe）</h2>
    <div class="video-wrap mb-3">
      <iframe src="https://www.youtube.com/embed/dvk3rm24mrk"
              title="YouTube video player" allowfullscreen
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
    </div>
    <p class="text-gray-500 text-sm mb-12">↑ 再生ボタンを押して再生できればOK。スマホでも幅に合わせて自動でサイズ調整される。</p>

    <!-- ② Instagram 埋め込み（公式embed.js） -->
    <h2 class="text-xl font-bold mb-4">② Instagram投稿（公式embed）</h2>
    <blockquote class="instagram-media" data-instgrm-captioned
      data-instgrm-permalink="https://www.instagram.com/p/C5w8m9rN6yT/"
      data-instgrm-version="14" style="max-width:540px;margin:0 auto;width:100%;"></blockquote>
    <script async src="https://www.instagram.com/embed.js"></script>
    <p class="text-gray-500 text-sm mt-3">↑ 実際の投稿URLに差し替えれば、その投稿カードがそのまま表示される（いいね・キャプション付き）。</p>
  </div>
</body>
</html>
