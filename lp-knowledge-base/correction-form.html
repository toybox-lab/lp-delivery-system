<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LP修正ヒアリングフォーム</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f5f5f5; color: #333; padding: 40px 20px; }
    .container { max-width: 640px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 40px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h1 { font-size: 22px; margin-bottom: 8px; color: #111; }
    .subtitle { font-size: 14px; color: #888; margin-bottom: 32px; }
    .form-group { margin-bottom: 28px; }
    label { display: block; font-size: 15px; font-weight: 600; margin-bottom: 10px; color: #222; }
    .required { color: #e53e3e; margin-left: 4px; }
    .radio-group, .checkbox-group { display: flex; flex-direction: column; gap: 10px; }
    .radio-group label, .checkbox-group label { font-weight: normal; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .section { background: #f9f9f9; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .section-title { font-size: 14px; font-weight: 600; color: #555; margin-bottom: 14px; }
    textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; resize: vertical; min-height: 100px; font-family: inherit; }
    textarea:focus { outline: none; border-color: #4a90e2; }
    input[type="datetime-local"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    .hidden { display: none; }
    button[type="submit"] { width: 100%; padding: 16px; background: #111; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    button[type="submit"]:hover { background: #333; }
    .success { text-align: center; padding: 40px; display: none; }
    .success h2 { font-size: 20px; margin-bottom: 12px; }
    .success p { color: #666; font-size: 14px; }
    .revision-badge { display: inline-block; background: #f0f4ff; border: 1px solid #c7d2fe; color: #4338ca; font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 20px; margin-bottom: 20px; }
    .revision-badge.warning { background: #fff7ed; border-color: #fed7aa; color: #c2410c; }
    .revision-float { display: none; position: fixed; top: 16px; right: 16px; z-index: 50; background: #f0f4ff; border: 1px solid #c7d2fe; color: #4338ca; font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.10); letter-spacing: 0.02em; }
    .revision-float.warning { background: #fff7ed; border-color: #fed7aa; color: #c2410c; }
    /* モーダル */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .modal { background: #fff; border-radius: 12px; padding: 32px; max-width: 420px; width: 90%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
    .modal h2 { font-size: 18px; margin-bottom: 12px; color: #c2410c; }
    .modal p { font-size: 14px; color: #555; line-height: 1.7; margin-bottom: 24px; }
    .modal button { padding: 12px 32px; background: #111; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .modal button:hover { background: #333; }
  </style>
</head>
<body>
  <div class="container">
    <div id="formArea">
      <h1>LP確認・修正ヒアリング</h1>
      <div id="revisionBadge" style="display:none"></div>
      <p class="subtitle"><span id="clientGreeting"></span>LPをご確認いただきありがとうございます。以下にご記入ください。</p>

      <form id="correctionForm">

        <input type="hidden" name="clientName" id="clientName">
        <input type="hidden" name="lpFile" id="lpFile">

        <div class="form-group">
          <label>修正はありますか？<span class="required">*</span></label>
          <div class="radio-group">
            <label><input type="radio" name="hasCorrection" value="yes" required> ある</label>
            <label><input type="radio" name="hasCorrection" value="no"> ない（このままで納品OK）</label>
          </div>
        </div>

        <div id="correctionDetails" class="hidden">

          <div class="form-group">
            <label>修正したい箇所を選んでください（複数選択可）</label>
            <div class="checkbox-group">
              <label><input type="checkbox" name="parts" value="キャッチコピー・タイトル"> キャッチコピー・タイトル</label>
              <label><input type="checkbox" name="parts" value="文章・本文"> 文章・本文</label>
              <label><input type="checkbox" name="parts" value="色・デザイン"> 色・デザイン</label>
              <label><input type="checkbox" name="parts" value="画像・写真"> 画像・写真</label>
              <label><input type="checkbox" name="parts" value="構成・順番"> 構成・順番</label>
              <label><input type="checkbox" name="parts" value="その他"> その他</label>
            </div>
          </div>

          <div class="section" id="catchcopySection" style="display:none">
            <div class="section-title">キャッチコピー・タイトル</div>
            <textarea name="catchcopy" placeholder="どう直してほしいですか？"></textarea>
          </div>
          <div class="section" id="bodySection" style="display:none">
            <div class="section-title">文章・本文</div>
            <textarea name="body" placeholder="どう直してほしいですか？"></textarea>
          </div>
          <div class="section" id="designSection" style="display:none">
            <div class="section-title">色・デザイン</div>
            <textarea name="design" placeholder="どう直してほしいですか？"></textarea>
          </div>
          <div class="section" id="imageSection" style="display:none">
            <div class="section-title">画像・写真</div>
            <textarea name="image" placeholder="どう直してほしいですか？"></textarea>
          </div>
          <div class="section" id="structureSection" style="display:none">
            <div class="section-title">構成・順番</div>
            <textarea name="structure" placeholder="どう直してほしいですか？"></textarea>
          </div>
          <div class="section" id="otherSection" style="display:none">
            <div class="section-title">その他</div>
            <textarea name="other" placeholder="どう直してほしいですか？"></textarea>
          </div>

          <div class="form-group">
            <label>LPアドバイザーと直接話したいですか？</label>
            <div class="radio-group">
              <label><input type="radio" name="wantsTalk" value="yes"> はい</label>
              <label><input type="radio" name="wantsTalk" value="no"> いいえ</label>
            </div>
          </div>

          <div id="scheduleSection" class="hidden">
            <div class="form-group">
              <label>第1希望の日時</label>
              <input type="datetime-local" name="schedule1">
            </div>
            <div class="form-group">
              <label>第2希望の日時（任意）</label>
              <input type="datetime-local" name="schedule2">
            </div>
            <div class="form-group">
              <label>備考（任意）</label>
              <textarea name="scheduleNote" placeholder="例：午後が希望、30分程度で大丈夫です など"></textarea>
            </div>
          </div>

        </div>

        <button type="submit">送信する</button>
      </form>
    </div>

    <!-- 右上固定バッジ -->
    <div class="revision-float" id="revisionFloat"></div>

    <!-- 4回目以降ポップアップ -->
    <div class="modal-overlay" id="paidModal">
      <div class="modal">
        <h2>⚠️ 追加修正について</h2>
        <p>今回は<strong id="modalRevisionNum"></strong>回目の修正依頼となります。<br>無料修正の範囲（3回）を超えているため、<br>追加修正は<strong>有料オプション</strong>となります。<br><br>ご了承の上、引き続きフォームをご記入ください。</p>
        <button onclick="document.getElementById('paidModal').classList.remove('show')">内容を確認しました</button>
      </div>
    </div>

    <div class="success" id="successArea">
      <h2>送信完了しました</h2>
      <p>ご回答ありがとうございます。<br>内容を確認後、担当者よりご連絡いたします。</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const WEBHOOK_URL = 'https://toibox.app.n8n.cloud/webhook/77e6c605-68ff-40f4-a26b-ed9762546590';
    const clientName = params.get('clientName') || '';
    document.getElementById('clientName').value = clientName;
    if (clientName) {
      document.getElementById('clientGreeting').textContent = clientName + '様、';
    }
    document.getElementById('lpFile').value = params.get('lpFile') || '';

    // 修正回数バッジ＋ポップアップ
    const revisionCount = parseInt(params.get('revisionCount') || '0', 10);
    if (revisionCount > 0) {
      const badge = document.getElementById('revisionBadge');
      const isPaid = revisionCount >= 4;
      badge.className = 'revision-badge' + (isPaid ? ' warning' : '');
      badge.textContent = '今回で ' + revisionCount + ' 回目の修正です' + (isPaid ? '（有料オプション対象）' : '');
      badge.style.display = 'inline-block';
      // 右上固定バッジ
      const floatBadge = document.getElementById('revisionFloat');
      floatBadge.className = 'revision-float' + (isPaid ? ' warning' : '');
      floatBadge.textContent = '修正 ' + revisionCount + ' 回目';
      floatBadge.style.display = 'block';

      if (isPaid) {
        document.getElementById('modalRevisionNum').textContent = revisionCount;
        document.getElementById('paidModal').classList.add('show');
      }
    }

    const form = document.getElementById('correctionForm');
    const correctionDetails = document.getElementById('correctionDetails');
    const scheduleSection = document.getElementById('scheduleSection');

    document.querySelectorAll('input[name="hasCorrection"]').forEach(radio => {
      radio.addEventListener('change', e => {
        correctionDetails.classList.toggle('hidden', e.target.value !== 'yes');
      });
    });

    document.querySelectorAll('input[name="wantsTalk"]').forEach(radio => {
      radio.addEventListener('change', e => {
        scheduleSection.classList.toggle('hidden', e.target.value !== 'yes');
      });
    });

    const partMap = {
      'キャッチコピー・タイトル': 'catchcopySection',
      '文章・本文': 'bodySection',
      '色・デザイン': 'designSection',
      '画像・写真': 'imageSection',
      '構成・順番': 'structureSection',
      'その他': 'otherSection'
    };

    document.querySelectorAll('input[name="parts"]').forEach(cb => {
      cb.addEventListener('change', e => {
        const sectionId = partMap[e.target.value];
        if (sectionId) {
          document.getElementById(sectionId).style.display = e.target.checked ? 'block' : 'none';
        }
      });
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      data.parts = Array.from(document.querySelectorAll('input[name="parts"]:checked')).map(cb => cb.value);
      data.submittedAt = new Date().toISOString();

      try {
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      } catch(err) {}

      document.getElementById('formArea').style.display = 'none';
      document.getElementById('successArea').style.display = 'block';
    });
  </script>
</body>
</html>
