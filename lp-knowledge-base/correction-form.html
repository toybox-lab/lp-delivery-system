<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LP修正ヒアリングフォーム</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
      padding: 40px 20px;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #111;
    }
    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 32px;
    }
    .form-group {
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #222;
    }
    .required {
      color: #e53e3e;
      margin-left: 4px;
    }
    .radio-group, .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .radio-group label, .checkbox-group label {
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .section {
      background: #f9f9f9;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #555;
      margin-bottom: 14px;
    }
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      resize: vertical;
      min-height: 100px;
      font-family: inherit;
    }
    textarea:focus {
      outline: none;
      border-color: #4a90e2;
    }
    .hidden { display: none; }
    button[type="submit"] {
      width: 100%;
      padding: 16px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button[type="submit"]:hover {
      background: #333;
    }
    .success {
      text-align: center;
      padding: 40px;
      display: none;
    }
    .success h2 {
      font-size: 20px;
      margin-bottom: 12px;
    }
    .success p {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="formArea">
      <h1>LP確認・修正ヒアリング</h1>
      <p class="subtitle"><span id="clientGreeting"></span>LPをご確認いただきありがとうございます。以下にご記入ください。</p>

      <form id="correctionForm">

        <input type="hidden" name="clientName" id="clientName">
        <input type="hidden" name="lpFile" id="lpFile">

        <div class="form-group">
          <label>修正はありますか？<span class="required">*</span></label>
          <div class="radio-group">
            <label><input type="radio" name="hasCorrection" value="yes" required> ある</label>
            <label><input type="radio" name="hasCorrection" value="no"> ない（このままで納品OK）</label>
          </div>
        </div>

        <div id="correctionDetails" class="hidden">

          <div class="form-group">
            <label>修正したい箇所を選んでください（複数選択可）</label>
            <div class="checkbox-group">
              <label><input type="checkbox" name="parts" value="キャッチコピー・タイトル"> キャッチコピー・タイトル</label>
              <label><input type="checkbox" name="parts" value="文章・本文"> 文章・本文</label>
              <label><input type="checkbox" name="parts" value="色・デザイン"> 色・デザイン</label>
              <label><input type="checkbox" name="parts" value="画像・写真"> 画像・写真</label>
              <label><input type="checkbox" name="parts" value="構成・順番"> 構成・順番</label>
              <label><input type="checkbox" name="parts" value="その他"> その他</label>
            </div>
          </div>

          <div class="section" id="catchcopySection" style="display:none">
            <div class="section-title">キャッチコピー・タイトル</div>
            <textarea name="catchcopy" placeholder="どう直してほしいですか？"></textarea>
          </div>
          <div class="section" id="bodySection" style="display:none">
            <div class="section-title">文章・本文</div>
            <textarea name="body" placeholder="どう直してほしいですか？"></textarea>
          </div>
          <div class="section" id="designSection" style="display:none">
            <div class="section-title">色・デザイン</div>
            <textarea name="design" placeholder="どう直してほしいですか？"></textarea>
          </div>
          <div class="section" id="imageSection" style="display:none">
            <div class="section-title">画像・写真</div>
            <textarea name="image" placeholder="どう直してほしいですか？"></textarea>
          </div>
          <div class="section" id="structureSection" style="display:none">
            <div class="section-title">構成・順番</div>
            <textarea name="structure" placeholder="どう直してほしいですか？"></textarea>
          </div>
          <div class="section" id="otherSection" style="display:none">
            <div class="section-title">その他</div>
            <textarea name="other" placeholder="どう直してほしいですか？"></textarea>
          </div>

          <div class="form-group">
            <label>LPアドバイザーと直接話したいですか？</label>
            <div class="radio-group">
              <label><input type="radio" name="wantsTalk" value="yes"> はい</label>
              <label><input type="radio" name="wantsTalk" value="no"> いいえ</label>
            </div>
          </div>

          <div id="scheduleSection" class="hidden">
            <div class="form-group">
              <label>第1希望の日時</label>
              <input type="datetime-local" name="schedule1" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:14px;">
            </div>
            <div class="form-group">
              <label>第2希望の日時（任意）</label>
              <input type="datetime-local" name="schedule2" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:14px;">
            </div>
            <div class="form-group">
              <label>備考（任意）</label>
              <textarea name="scheduleNote" placeholder="例：午後が希望、30分程度で大丈夫です など"></textarea>
            </div>
          </div>

        </div>

        <button type="submit">送信する</button>
      </form>
    </div>

    <div class="success" id="successArea">
      <h2>送信完了しました</h2>
      <p>ご回答ありがとうございます。<br>内容を確認後、担当者よりご連絡いたします。</p>
    </div>
  </div>

  <script>
    // URLパラメータからWebhookURLを取得
    const params = new URLSearchParams(window.location.search);
    const WEBHOOK_URL = params.get('webhook') || '';
    const clientName = params.get('clientName') || '';
    document.getElementById('clientName').value = clientName;
    if (clientName) {
      document.getElementById('clientGreeting').textContent = clientName + '様、';
    }
    document.getElementById('lpFile').value = params.get('lpFile') || '';

    const form = document.getElementById('correctionForm');
    const correctionDetails = document.getElementById('correctionDetails');
    const scheduleSection = document.getElementById('scheduleSection');

    document.querySelectorAll('input[name="hasCorrection"]').forEach(radio => {
      radio.addEventListener('change', e => {
        correctionDetails.classList.toggle('hidden', e.target.value !== 'yes');
      });
    });

    document.querySelectorAll('input[name="wantsTalk"]').forEach(radio => {
      radio.addEventListener('change', e => {
        scheduleSection.classList.toggle('hidden', e.target.value !== 'yes');
      });
    });

    const partMap = {
      'キャッチコピー・タイトル': 'catchcopySection',
      '文章・本文': 'bodySection',
      '色・デザイン': 'designSection',
      '画像・写真': 'imageSection',
      '構成・順番': 'structureSection',
      'その他': 'otherSection'
    };

    document.querySelectorAll('input[name="parts"]').forEach(cb => {
      cb.addEventListener('change', e => {
        const sectionId = partMap[e.target.value];
        if (sectionId) {
          document.getElementById(sectionId).style.display = e.target.checked ? 'block' : 'none';
        }
      });
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      data.parts = Array.from(document.querySelectorAll('input[name="parts"]:checked')).map(cb => cb.value);
      data.submittedAt = new Date().toISOString();

      try {
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      } catch(err) {}

      document.getElementById('formArea').style.display = 'none';
      document.getElementById('successArea').style.display = 'block';
    });
  </script>
</body>
</html>
